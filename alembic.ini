# Alembic configuration.
#
# sqlalchemy.url is deliberately absent. The URL comes from DATABASE_URL through
# the same reader the application uses (see alembic/env.py), so a migration can
# never run against a different database than the one the app is talking to --
# which is the usual way a "migration applied successfully" report turns out to
# have been applied to an empty file in someone's home directory.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
