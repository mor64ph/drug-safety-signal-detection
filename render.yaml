# Render blueprint. Commit this, then in Render: New > Blueprint > pick the repo.
#
# Two services: the web app, and a Postgres instance for accounts. The signal
# table itself is baked into the image as a parquet file rather than loaded into
# Postgres -- it is a read-only 17 MB snapshot replaced wholesale by the
# pipeline, so a database would add operational cost and no benefit. Postgres
# exists only for user accounts, which are read-write.

services:
  - type: web
    name: rxsignal
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # free tier sleeps after inactivity; starter does not
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: false      # deploy deliberately, not on every push to main

    envVars:
      # Supplied by Render.
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: rxsignal-db
          property: connectionString

      # Generated once by Render and kept. A changing key signs every user out
      # on each deploy and invalidates pending password-reset links.
      - key: RXSIGNAL_SECRET_KEY
        generateValue: true

      # Cookies are HTTPS-only here because Render terminates TLS.
      - key: RXSIGNAL_COOKIE_SECURE
        value: "true"
      - key: APP_BASE_URL
        value: https://rxsignal.onrender.com    # match your real hostname

      - key: RXSIGNAL_RATE_LIMIT
        value: "60"

      # Set these in the Render dashboard, not here -- this file is committed.
      #   RXSIGNAL_ACCESS_CODE_HASH   gate for closed review (scripts/make_access_code.py)
      #   RXSIGNAL_ADMIN_CODE         guards /admin/analytics
      #   OPENFDA_API_KEY             only needed if you refresh data on the host
      #   SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD / SMTP_FROM
      - key: RXSIGNAL_ACCESS_CODE_HASH
        sync: false
      - key: RXSIGNAL_ADMIN_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: rxsignal-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
