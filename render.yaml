# Render blueprint. Commit this, then in Render: New > Blueprint > pick the repo.
#
# One service: the web app. The signal table is baked into the image as a
# parquet file rather than loaded into a database -- it is a read-only ~28 MB
# snapshot replaced wholesale by the pipeline, so a database would add
# operational cost and no benefit.
#
# Accounts DO need a real database, and it is deliberately not declared here.
# Render's free Postgres is deleted after 30 days, which is acceptable for a
# demo and not for accounts real people were asked to create. Point
# DATABASE_URL at an external Postgres with a durable free tier (Neon,
# Supabase) instead. To move onto Render's own Postgres later, add a
# `databases:` block and swap DATABASE_URL to `fromDatabase`.

# The weekly change digest is NOT here, and that is deliberate (defect D-06).
# Render's cron services are not offered on the free plan, and this project runs
# at zero cost, so the schedule lives in .github/workflows/weekly-digest.yml
# instead. If this ever moves to a paid plan, the block below replaces it and
# the workflow should be deleted in the same commit -- two schedulers running
# the same job would double-send, because emailed_at is stamped only after a
# delivery succeeds.
#
#   - type: cron
#     name: reportscope-digests
#     runtime: docker
#     dockerfilePath: ./Dockerfile
#     schedule: "0 9 * * 1"
#     dockerCommand: sh -c "python -m src.snapshots && python scripts/send_digests.py"
#     region: singapore
#     plan: starter
#     envVars:
#       - fromGroup: reportscope-mail

services:
  - type: web
    name: reportscope
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free sleeps after ~15 minutes idle, so the first visitor after a quiet
    # spell waits 30-50s for a cold start. Change to `starter` to stop that.
    plan: free
    # Must match wherever DATABASE_URL points. The app makes several queries
    # per page -- session, user, tracked medicines -- so a cross-region pairing
    # adds its round trip to each one and the site feels slow for no reason.
    # Singapore also sits far closer to the intended testers than Oregon.
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: false      # deploy deliberately, not on every push to main

    envVars:
      - key: PORT
        value: 8000

      # Generated once by Render and kept. A changing key signs every user out
      # on each deploy and invalidates pending password-reset links.
      - key: RXSIGNAL_SECRET_KEY
        generateValue: true

      # Cookies are HTTPS-only here because Render terminates TLS.
      - key: RXSIGNAL_COOKIE_SECURE
        value: "true"

      - key: RXSIGNAL_RATE_LIMIT
        value: "60"

      # Set every one of these in the Render dashboard, not here -- this file is
      # committed to a repository.
      #
      #   DATABASE_URL          the external Postgres connection string
      #   APP_BASE_URL          this service's real https:// URL, no trailing
      #                         slash. It builds the links inside verification
      #                         emails AND the sitemap, so a wrong value gives
      #                         dead links and a wrong sitemap, silently.
      #   RXSIGNAL_ADMIN_CODE   guards /admin/analytics
      #   SMTP_*                mail credentials
      #   OPENFDA_API_KEY       only if refreshing data on the host
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: RXSIGNAL_ADMIN_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
