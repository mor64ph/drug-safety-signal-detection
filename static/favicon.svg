<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="reportscope">
  <!-- The mark is the method: four reporting rates on a shared baseline, one
       standing far above the others. That is what disproportionality is, and it
       stays legible at 16px because it is four rectangles and nothing else. -->
  <rect width="32" height="32" rx="6" fill="#1c5468"/>
  <g fill="#f5f4f1">
    <rect x="5"  y="18" width="4" height="9"  rx="1"/>
    <rect x="11" y="15" width="4" height="12" rx="1"/>
    <rect x="17" y="6"  width="4" height="21" rx="1"/>
    <rect x="23" y="19" width="4" height="8"  rx="1"/>
  </g>
</svg>
